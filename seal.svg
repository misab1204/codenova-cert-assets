<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <!-- Ribbon tails gradients -->
    <linearGradient id="ribbonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b3974" />
      <stop offset="45%" stop-color="#102550" />
      <stop offset="100%" stop-color="#08142c" />
    </linearGradient>
    <linearGradient id="ribbonGoldEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5d680" />
      <stop offset="50%" stop-color="#fff5cc" />
      <stop offset="100%" stop-color="#c99831" />
    </linearGradient>

    <!-- Gold Gradients -->
    <radialGradient id="goldRadial" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fae39d" />
      <stop offset="50%" stop-color="#dca93e" />
      <stop offset="80%" stop-color="#a4741e" />
      <stop offset="100%" stop-color="#664609" />
    </radialGradient>

    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#fde492" />
      <stop offset="50%" stop-color="#d4a237" />
      <stop offset="75%" stop-color="#8e6215" />
      <stop offset="100%" stop-color="#422a03" />
    </linearGradient>

    <linearGradient id="starLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fff2bd" />
      <stop offset="100%" stop-color="#f0c660" />
    </linearGradient>

    <linearGradient id="starDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2af3d" />
      <stop offset="60%" stop-color="#b37f19" />
      <stop offset="100%" stop-color="#795109" />
    </linearGradient>

    <radialGradient id="goldBead" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ffea9f" />
      <stop offset="100%" stop-color="#966b1a" />
    </radialGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b5" />
      <stop offset="50%" stop-color="#e5b448" />
      <stop offset="100%" stop-color="#9c6f1a" />
    </linearGradient>

    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

